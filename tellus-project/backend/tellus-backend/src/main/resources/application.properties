spring.application.name=tellus-backend
# Nom de la base de données (Spring la créera automatiquement si elle n'existe pas)
spring.data.mongodb.database=tellus_db
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017

# Très important pour la géolocalisation de Tellus
# Force Spring à créer les index 2dsphere définis dans ton modèle @Document
spring.data.mongodb.auto-index-creation=true

tellus.app.jwtSecret=${JWT_SECRET}
tellus.app.jwtExpirationMs=${JWT_EXPIRATION_MS}